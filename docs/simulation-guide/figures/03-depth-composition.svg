<text x="78.0" y="503" font-size="16" fill="#53647B" font-weight="400" text-anchor="middle">-6</text>
<text x="219.0" y="503" font-size="16" fill="#53647B" font-weight="400" text-anchor="middle">-3</text>
<text x="360.0" y="503" font-size="16" fill="#53647B" font-weight="400" text-anchor="middle">0</text>
<text x="501.0" y="503" font-size="16" fill="#53647B" font-weight="400" text-anchor="middle">3</text>
<text x="642.0" y="503" font-size="16" fill="#53647B" font-weight="400" text-anchor="middle">6</text>
<text x="56" y="548" font-size="17" fill="#53647B" font-weight="400" text-anchor="start">负侧：焦后层       0：焦内直通       正侧：焦前层</text>
<rect x="752" y="140" width="656" height="430" rx="16" fill="#FFFFFF" stroke="#D5DEED" stroke-width="1.5"/>
<rect x="770" y="160" width="5" height="25" rx="2" fill="#247B64"/>
<text x="788" y="181" font-size="23" fill="#247B64" font-weight="700" text-anchor="start">深度与符号约定</text>
<text x="776" y="218" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">有效深度图会对齐尺寸，并再次归一化。</text>
<text x="776" y="247" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">d 越大表示越近；c 的正负来自 d − focus。</text>
<text x="776" y="276" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">c 的绝对值由景深、光圈及虚化强度共同决定。</text>
<text x="776" y="305" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">例如 c = +0.27：t = +1.62。</text>
<text x="776" y="334" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">源贡献分到第 1、2 档，权重分别为 0.38、0.62。</text>
<text x="776" y="363" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">核函数相位的 defocus_sign = −sign(c)，</text>
<text x="776" y="392" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">它与深度分层使用的符号不可直接混称。</text>
<rect x="32" y="630" width="416" height="135" rx="16" fill="#FFFFFF" stroke="#D5DEED" stroke-width="1.5"/>
<rect x="50" y="650" width="5" height="25" rx="2" fill="#2346E8"/>
<text x="68" y="671" font-size="23" fill="#2346E8" font-weight="700" text-anchor="start">焦后背景 C_far</text>
<text x="56" y="708" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">颜色 ÷ 累计覆盖权重</text>
<text x="56" y="737" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">不足覆盖时回退至输入底图</text>
<polyline points="240,765 240,825" fill="none" stroke="#60779E" stroke-width="2"/>
<polygon points="240,825 234.0,813.0 246.0,813.0" fill="#60779E"/>
<rect x="512" y="630" width="416" height="135" rx="16" fill="#FFFFFF" stroke="#D5DEED" stroke-width="1.5"/>
<rect x="530" y="650" width="5" height="25" rx="2" fill="#247B64"/>
<text x="548" y="671" font-size="23" fill="#247B64" font-weight="700" text-anchor="start">焦内图像 I × S</text>
<text x="536" y="708" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">保留目标尺寸的原图细节</text>
<text x="536" y="737" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">S 来自 CoC 与主体边缘设置</text>
<polyline points="720,765 720,825" fill="none" stroke="#60779E" stroke-width="2"/>
<polygon points="720,825 714.0,813.0 726.0,813.0" fill="#60779E"/>
<rect x="992" y="630" width="416" height="135" rx="16" fill="#FFFFFF" stroke="#D5DEED" stroke-width="1.5"/>
<rect x="1010" y="650" width="5" height="25" rx="2" fill="#C44D39"/>
<text x="1028" y="671" font-size="23" fill="#C44D39" font-weight="700" text-anchor="start">焦前层 C_near / A</text>
<text x="1016" y="708" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">扩散颜色与覆盖率一起生成</text>
<text x="1016" y="737" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">主体保护可约束前层覆盖</text>
<polyline points="1200,765 1200,825" fill="none" stroke="#60779E" stroke-width="2"/>
<polygon points="1200,825 1194.0,813.0 1206.0,813.0" fill="#60779E"/>
<rect x="32" y="825" width="1376" height="150" rx="16" fill="#FFFFFF" stroke="#D5DEED" stroke-width="1.5"/>
<rect x="50" y="845" width="5" height="25" rx="2" fill="#2346E8"/>
<text x="68" y="866" font-size="23" fill="#2346E8" font-weight="700" text-anchor="start">最终混合与透明效果层</text>
<text x="56" y="903" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">先将各失焦颜色层编码回 sRGB，再按焦内掩膜与焦前覆盖率混合原图。</text>
<text x="56" y="932" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">F = S(1 − A)，效果层 alpha = 1 − F；效果颜色采用相同的预乘贡献恢复。</text>
<text x="56" y="961" font-size="18" fill="#19273E" font-weight="400" text-anchor="start">普通模式的效果 alpha = 1 − S；两条分支都可以返回合成图及透明图层。</text>
<text x="32" y="999" font-size="17" fill="#53647B" font-weight="400" text-anchor="start">图中的权重是源码离焦插值示意，不是标定物距或毫米单位的弥散圆。</text>
<text x="32" y="1026" font-size="17" fill="#53647B" font-weight="400" text-anchor="start">卷积和源贡献叠加在线性光空间；最终焦内 / 前后层混合位于编码空间。</text>
</g></svg>